<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Core Memory Diamond Gradient -->
    <linearGradient id="p_cx_coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00f5ff" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Telemetry Bus Track Gradient -->
    <linearGradient id="p_cx_trackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Synaptic Radial Pulse Gradient -->
    <radialGradient id="p_cx_pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#00f5ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070b14" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Glow Filter -->
    <filter id="p_cx_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Drop Shadow Filter for contrast on any background -->
    <filter id="p_cx_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <g filter="url(#p_cx_shadow)">
    <!-- 1. Ambient Synaptic Radial Field -->
    <circle cx="256" cy="256" r="160" fill="url(#p_cx_pulse)" />

    <!-- 2. Concentric Telemetry Orbit Rings -->
    <circle cx="256" cy="256" r="195" fill="none" stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 9" stroke-opacity="0.35" />
    <circle cx="256" cy="256" r="132" fill="none" stroke="#00f5ff" stroke-width="1.8" stroke-dasharray="14 8" stroke-opacity="0.5" />

    <!-- 3. Hexagonal Synaptic Geometry Matrix -->
    <g stroke="url(#p_cx_trackGrad)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.45">
      <polygon points="256,120 374,188 374,324 256,392 138,324 138,188" stroke-dasharray="8 6" />
      <polygon points="256,160 339,208 339,304 256,352 173,304 173,208" opacity="0.75" />
    </g>

    <!-- 4. Telemetry Bus Pathways (Interconnect Traces) -->
    <g stroke="url(#p_cx_trackGrad)" stroke-linecap="round">
      <!-- Outer to Intermediate Tracks -->
      <path d="M 256 120 L 256 200" stroke-width="3" />
      <path d="M 374 188 L 312 216" stroke-width="3" />
      <path d="M 374 324 L 312 296" stroke-width="3" />
      <path d="M 256 392 L 256 312" stroke-width="3" />
      <path d="M 138 324 L 200 296" stroke-width="3" />
      <path d="M 138 188 L 200 216" stroke-width="3" />

      <!-- Intermediate to Core Convergence Tracks -->
      <path d="M 200 216 L 256 256" stroke-width="3.8" stroke-opacity="0.9" />
      <path d="M 312 216 L 256 256" stroke-width="3.8" stroke-opacity="0.9" />
      <path d="M 312 296 L 256 256" stroke-width="3.8" stroke-opacity="0.9" />
      <path d="M 200 296 L 256 256" stroke-width="3.8" stroke-opacity="0.9" />
    </g>

    <!-- 5. Neural Synapse Memory Nodes -->
    <g filter="url(#p_cx_glow)">
      <!-- Outer Hexagonal Nodes (Episodic Storage Clusters) -->
      <circle cx="256" cy="120" r="11" fill="#00f5ff" stroke="#ffffff" stroke-width="2" />
      <circle cx="374" cy="188" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
      <circle cx="374" cy="324" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="2" />
      <circle cx="256" cy="392" r="11" fill="#ec4899" stroke="#ffffff" stroke-width="2" />
      <circle cx="138" cy="324" r="11" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
      <circle cx="138" cy="188" r="11" fill="#00f5ff" stroke="#ffffff" stroke-width="2" />

      <!-- Intermediate Relay Nodes -->
      <circle cx="200" cy="216" r="8.5" fill="#00f5ff" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="312" cy="216" r="8.5" fill="#8b5cf6" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="312" cy="296" r="8.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="200" cy="296" r="8.5" fill="#ec4899" stroke="#ffffff" stroke-width="1.5" />

      <!-- 6. Central Cortex Brain / Memory Diamond Core -->
      <polygon points="256,204 300,256 256,308 212,256" 
               fill="url(#p_cx_coreGrad)" 
               stroke="#ffffff" 
               stroke-width="3" 
               stroke-linejoin="round" />
      
      <!-- Quantum Singularity Center -->
      <circle cx="256" cy="256" r="13" fill="#ffffff" />
      <circle cx="256" cy="256" r="6" fill="#00f5ff" />
    </g>

    <!-- 7. High-Energy Quantum Data Pulse Sparks -->
    <circle cx="256" cy="160" r="3.5" fill="#ffffff" />
    <circle cx="343" cy="202" r="3.5" fill="#ffffff" />
    <circle cx="343" cy="310" r="3.5" fill="#ffffff" />
    <circle cx="256" cy="352" r="3.5" fill="#ffffff" />
    <circle cx="169" cy="310" r="3.5" fill="#ffffff" />
    <circle cx="169" cy="202" r="3.5" fill="#ffffff" />
  </g>
</svg>
