<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C4DFF"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Shield -->
  <rect width="128" height="128" rx="28" fill="#0A0E17"/>
  <rect x="2" y="2" width="124" height="124" rx="26" fill="none" stroke="url(#cortexGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Neural Cortex / Synapse Lattice -->
  <g filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="64" cy="64" r="10" fill="#00E5FF"/>
    
    <!-- Outer Synapses -->
    <circle cx="36" cy="42" r="6" fill="#7C4DFF"/>
    <circle cx="92" cy="42" r="6" fill="#7C4DFF"/>
    <circle cx="36" cy="86" r="6" fill="#00E5FF"/>
    <circle cx="92" cy="86" r="6" fill="#FF1744"/>
    <circle cx="64" cy="30" r="5" fill="#00E5FF"/>
    <circle cx="64" cy="98" r="5" fill="#FF1744"/>

    <!-- Neural Connectors -->
    <path d="M64 64 L36 42 M64 64 L92 42 M64 64 L36 86 M64 64 L92 86 M64 64 L64 30 M64 64 L64 98 M36 42 L64 30 L92 42 M36 86 L64 98 L92 86" 
          stroke="url(#cortexGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
